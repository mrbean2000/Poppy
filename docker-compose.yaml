services:
  postgres:
    image: postgres:18.6
    container_name: postgres_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: s9515650i
      POSTGRES_DB: Poppy
    ports:
      - "5455:5432"
    volumes:
      - postgres_data:/var/lib/postgresql

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: backend_service
    ports:
      - "7070:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres_db:5432/Poppy
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: s9515650i
    depends_on:
      - postgres

  backend-nodejs:
    build:
      context: ./backend-nodejs
      dockerfile: Dockerfile
    container_name: backend_nodejs_service
    ports:
      - "3001:3001"
    depends_on:
      - postgres

volumes:
  postgres_data:
